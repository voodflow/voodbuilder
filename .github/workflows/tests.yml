name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup PHP
        uses: shivammathur/setup-php@b2f833f7d1c070621af195c088d275c4cd60ef8f # 2.9.0
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, intl, pdo_sqlite, gd, fileinfo
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm

      # autoload-dev maps private monorepo siblings (../vtuts, ../vpopups, …).
      # Empty folders keep Composer's classmap happy; tests that need them skip.
      - name: Stub monorepo siblings
        run: |
          php -r '$c = json_decode(file_get_contents("composer.json"), true);
            foreach (array_merge(array_values($c["autoload-dev"]["psr-4"]), $c["autoload-dev"]["classmap"]) as $p) {
              if (str_starts_with($p, "../")) { @mkdir($p, 0777, true); }
            }'
          mkdir -p ../voodbuilder-dynamic-api/tests

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      # Tailwind page compile (PHP tests) shells out to node_modules.
      - name: Install npm dependencies
        run: npm ci --no-audit --no-fund

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: PHPUnit
        run: vendor/bin/phpunit --no-progress

      - name: Vitest
        run: npm run test:js
